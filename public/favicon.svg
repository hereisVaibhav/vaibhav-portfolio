<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111936" />
      <stop offset="60%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#b529c9" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>

    <!-- Left Wing Gradient -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#5500ff" />
    </linearGradient>

    <!-- Right Wing Gradient -->
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93" />
      <stop offset="50%" stop-color="#b529c9" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00a8e8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Central Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#00a8e8" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Core Glow Filter -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle Body -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10" />

  <!-- Subtle Cyber Grid / Circuit Accents -->
  <g opacity="0.18" stroke="#00f0ff" stroke-width="2" stroke-linecap="round">
    <!-- Corner Tech Marks -->
    <path d="M 80 120 L 80 80 L 120 80" />
    <path d="M 432 120 L 432 80 L 392 80" />
    <path d="M 80 392 L 80 432 L 120 432" />
    <path d="M 432 392 L 432 432 L 392 432" />

    <!-- Circuit Trace Lines -->
    <line x1="80" y1="256" x2="130" y2="256" />
    <line x1="382" y1="256" x2="432" y2="256" />
    <circle cx="130" cy="256" r="4" fill="#00f0ff" />
    <circle cx="382" cy="256" r="4" fill="#00f0ff" />
  </g>

  <!-- Ambient Backdrop Glow behind the V -->
  <circle cx="256" cy="270" r="140" fill="url(#coreGlow)" filter="url(#intenseGlow)" opacity="0.65" />

  <!-- Futuristic Holographic "V" Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Left Cyber Wing of "V" -->
    <path d="M 116 136 
             L 194 136 
             L 256 328 
             L 214 340 
             L 100 166 
             Z" 
          fill="url(#leftWing)" />

    <!-- Right Cyber Wing of "V" -->
    <path d="M 396 136 
             L 318 136 
             L 256 328 
             L 298 340 
             L 412 166 
             Z" 
          fill="url(#rightWing)" />

    <!-- Left Inner Facet (adds 3D metallic cyberpunk depth) -->
    <path d="M 194 136 
             L 256 328 
             L 242 328 
             L 182 148 
             Z" 
          fill="#ffffff" 
          opacity="0.3" />

    <!-- Right Inner Facet -->
    <path d="M 318 136 
             L 256 328 
             L 270 328 
             L 330 148 
             Z" 
          fill="#ffffff" 
          opacity="0.2" />

    <!-- Vertex Shield / Energy Anchor at bottom -->
    <path d="M 256 348 
             L 226 312 
             L 256 406 
             L 286 312 
             Z" 
          fill="url(#diamondGrad)" 
          opacity="0.95" />

    <!-- Top Floating Cyber Crest / Crown Diamond -->
    <polygon points="256,160 274,188 256,216 238,188" 
             fill="url(#diamondGrad)" />
  </g>

  <!-- Central Quantum Focus Node -->
  <circle cx="256" cy="188" r="4" fill="#ffffff" filter="url(#intenseGlow)" />
  <circle cx="256" cy="385" r="3" fill="#00ffcc" filter="url(#intenseGlow)" />
</svg>
